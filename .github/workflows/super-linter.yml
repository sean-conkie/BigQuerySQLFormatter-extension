---
# This workflow executes several linters on changed files based on languages used in your code
# base whenever you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/super-linter/super-linter
name: Lint Code Base

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
jobs:
  run-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9
        env:
          VALIDATE_ALL_CODEBASE: false
          # ESLint runs with the repository's dependencies in the Node.js workflow.
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_TYPESCRIPT_ES: false
          # Use the existing ESLint and Prettier rules instead of conflicting Biome defaults.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: .github/linters
