---
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/server"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "google-auth-library"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "gaxios"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "gcp-metadata"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "chai"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "sinon-chai"
        update-types:
          - "version-update:semver-major"
      # TypeScript majors need a deliberate compiler migration.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "google-auth-library"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "gaxios"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "gcp-metadata"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "chai"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "sinon-chai"
        update-types:
          - "version-update:semver-major"
      # TypeScript majors need a deliberate compiler migration.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # Mocha 12 requires newer Node than VS Code 1.91's embedded Node 20.9.
      - dependency-name: "mocha"
        update-types:
          - "version-update:semver-major"
      # Newer https-proxy-agent majors are ESM-only; client tests use CommonJS.
      - dependency-name: "https-proxy-agent"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
